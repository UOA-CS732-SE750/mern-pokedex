name: Backend Tests

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for backend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-tests.yml'

  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test -- --run --reporter=verbose
        continue-on-error: true
        id: tests

      - name: Comment test results on PR
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const testStatus = '${{ steps.tests.outcome }}';
            const emoji = testStatus === 'success' ? '✅' : '❌';
            const statusText = testStatus === 'success' ? 'PASSED' : 'FAILED';
            
            const body = `## ${emoji} Backend Tests ${statusText}
            
            **Workflow:** ${context.workflow}
            **Status:** ${statusText}
            **Commit:** ${context.sha.substring(0, 7)}
            
            ${testStatus === 'success' 
              ? '✨ All backend tests passed successfully!' 
              : '⚠️ Some backend tests failed. Please review the logs above.'}
            
            [View full test results](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  # This job ensures the workflow always reports a status
  status:
    name: Backend Tests Status
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always()
    steps:
      - name: Report skipped
        if: needs.changes.outputs.backend != 'true'
        run: echo "Backend tests skipped - no backend files changed"
      
      - name: Check test result
        if: needs.changes.outputs.backend == 'true' && needs.test.result != 'success'
        run: exit 1
