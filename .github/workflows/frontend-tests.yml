name: Frontend Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run --reporter=verbose
        continue-on-error: true
        id: tests

      - name: Comment test results on PR
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const testStatus = '${{ steps.tests.outcome }}';
            const emoji = testStatus === 'success' ? '✅' : '❌';
            const statusText = testStatus === 'success' ? 'PASSED' : 'FAILED';
            
            const body = `## ${emoji} Frontend Tests ${statusText}
            
            **Workflow:** ${context.workflow}
            **Status:** ${statusText}
            **Commit:** ${context.sha.substring(0, 7)}
            
            ${testStatus === 'success' 
              ? '✨ All frontend tests passed successfully!' 
              : '⚠️ Some frontend tests failed. Please review the logs above.'}
            
            [View full test results](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
